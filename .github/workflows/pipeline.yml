name: Prisma (pipeline)

# NO hay cron activo. Para programarlo cada 2 horas, descomente el bloque 'schedule' cuando confirme.
# En la rama de trabajo solo ejecuta y mide el pipeline; el despliegue a Pages se añade en la fase 5.
on:
  push:
    branches: [claude/sharp-ride-ov3q5l]
    paths: ["pipeline/**", "config/**", "scripts/make_sample.py", ".github/workflows/pipeline.yml"]
  workflow_dispatch:
  # schedule:
  #   - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: prisma-pipeline
  cancel-in-progress: false

env:
  SITE_URL: https://xacoy.github.io/PrismaNews
  FASTEMBED_CACHE: ${{ github.workspace }}/.fastembed-cache

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .fastembed-cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - run: pip install -r pipeline/requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q

      - name: Copia de respaldo del histórico (caché)
        id: backup
        uses: actions/cache/restore@v4
        with:
          path: backup
          key: prisma-data-none
          restore-keys: prisma-data-

      - name: Recuperar histórico publicado
        run: |
          mkdir -p prev
          ok=1; fail=0
          for f in groups.json pool.json; do
            code=$(curl -sS -L --retry 3 --retry-delay 5 -o "prev/$f" -w '%{http_code}' "$SITE_URL/data/$f" || echo 000)
            if [ "$code" = 200 ]; then echo "$f: recuperado del sitio";
            else rm -f "prev/$f"; ok=0; [ "$code" = 404 ] || fail=1; echo "$f: HTTP $code"; fi
          done
          if [ $ok = 0 ]; then
            if [ -f backup/groups.json ] && [ -f backup/pool.json ]; then
              echo "::warning::Se usa la copia de respaldo de la caché"; cp backup/groups.json backup/pool.json prev/
            elif [ $fail = 1 ]; then
              echo "::error::No se pudo recuperar el histórico (error distinto de 404) y no hay copia: se aborta para no perderlo"; exit 1
            else
              echo "Primera ejecución: se empieza sin histórico"
            fi
          fi
          ls -la prev

      - name: Recoger, agrupar y exportar
        run: python -m prisma.run --prev-dir prev --out-dir web/public/data
        working-directory: .
        env:
          PYTHONPATH: pipeline

      - name: Validar datos
        run: python -m prisma.validate web/public/data
        env:
          PYTHONPATH: pipeline

      - name: Guardar copia de respaldo
        run: mkdir -p backup && cp web/public/data/groups.json web/public/data/pool.json backup/
      - uses: actions/cache/save@v4
        with:
          path: backup
          key: prisma-data-${{ github.run_id }}

      - name: Resumen de tiempos
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("web/public/data/meta.json"))
          print("### Prisma: resumen de la ejecución\n")
          print("| Paso | Segundos |\n|---|---|")
          for k, v in m["timings"].items():
              print(f"| {k} | {v} |")
          print("\n```json\n" + json.dumps(m["counts"], indent=1) + "\n```")
          bad = [f for f in m["feeds"] if not f["ok"]]
          if bad:
              print("\nFeeds con problemas: " + ", ".join(f"{f['name']} ({f['error']})" for f in bad))
          PY

      - name: Muestra de datos (para desarrollo)
        run: python scripts/make_sample.py web/public/data/groups.json 24
