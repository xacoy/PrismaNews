name: Evaluación de la agrupación (puntual)

# Se ejecuta al tocar el código de agrupación, el umbral o las etiquetas en la rama de trabajo. Sin cron.
on:
  push:
    branches: [claude/sharp-ride-ov3q5l]
    paths: [scripts/eval_threshold.py, "pipeline/**", config/clustering.yml, "tests/fixtures/pairs*", .github/workflows/evaluacion.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .fastembed-cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - run: pip install -r pipeline/requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q
      - name: Evaluar umbral
        run: python scripts/eval_threshold.py --min-precision 0.95
